<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>

  font-style: normal;

  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {

}
:where(html) {

}

<meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اليومية - Omar PRO v28 - الإجمالي منسق + طي + تعديل</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0fdf4;--bg-soft:#dcfce7;--card:#ffffff;--card-border:#bbf7d0;--text:#14532d;--text-soft:#15803d;--hero:#16a34a;--hero-soft:#15803d;--gradient:linear-gradient(135deg,#16a34a,#15803d);--font-size-base:13px}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-main,'Tajawal',sans-serif)}
html{font-size:var(--font-size-base);background:var(--bg);color:var(--text)}
body{background:var(--bg);color:var(--text);min-height:100%;padding-bottom:calc(var(--font-size-base)*5)}
.app{max-width:100%;width:100%;margin:0 auto;padding:8px;min-height:100%;padding-bottom:calc(var(--font-size-base)*6)}
.top{position:sticky;top:0;z-index:20;background:var(--card);border:1.5px solid var(--card-border);border-radius:13px;padding:calc(var(--font-size-base)*0.7) 12px;display:flex;justify-content:space-between;align-items:center}
.top h3{font-size:calc(var(--font-size-base) * 0.85)!important}
#today{font-size:calc(var(--font-size-base) * 0.55)!important;background:var(--hero);color:#fff;padding:3px 8px;border-radius:20px}
.main-tabs{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:14px;border:1.5px solid var(--card-border);margin:8px 0;overflow:auto}
.mtab{flex:1;white-space:nowrap;border:none;padding:calc(var(--font-size-base)*0.7) 6px;border-radius:10px;font-weight:900;font-size:calc(var(--font-size-base) * 0.62)!important;cursor:pointer;background:transparent;color:var(--text-soft);min-width:60px}
.mtab.active{background:var(--hero);color:#fff}
.month-nav{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:calc(var(--font-size-base)*0.5) 10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.month-nav button{width:calc(var(--font-size-base) * 2.3);height:calc(var(--font-size-base) * 2.3);border-radius:9px;border:1px solid var(--card-border);background:var(--bg-soft);color:var(--text);font-weight:900;font-size:calc(var(--font-size-base) * 1.1)!important;cursor:pointer}
.month-label{font-weight:900;font-size:calc(var(--font-size-base) * 0.85)!important;display:flex;flex-direction:column;align-items:center}
.month-label small{font-size:calc(var(--font-size-base) * 0.48)!important;color:var(--text-soft)}
.kpi-grid-5{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:5px!important;margin-bottom:8px}
.stat{background:var(--card);border:1.5px solid var(--card-border);border-radius:10px;position:relative;overflow:hidden;min-height:calc(var(--font-size-base) * 4.2)!important;padding:5px 3px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important}
.stat::after{content:'';position:absolute;top:0;right:0;width:100%;height:2px;background:var(--hero)}
.stat small{font-size:calc(var(--font-size-base) * 0.42)!important;color:var(--text-soft);font-weight:800;line-height:1.1;display:block}
.stat b{font-size:calc(var(--font-size-base) * 0.6)!important;font-weight:900;margin-top:2px;display:block}
.stat.red b{color:#ef4444}.stat.green b{color:#22c55e}

/* المصروفات الثابتة - 2 في الصف - صغيرة - بتختفي */
.fixed-box{background:var(--card);border:1.5px solid var(--hero);border-radius:11px;overflow:hidden;margin-bottom:8px}
.fixed-head{padding:calc(var(--font-size-base) * 0.6) calc(var(--font-size-base) * 0.7);display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--bg-soft);user-select:none}
.fixed-head b{font-size:calc(var(--font-size-base) * 0.65)!important;font-weight:900}
#fixedTotalBadge{font-size:calc(var(--font-size-base) * 0.55)!important;background:var(--hero);color:#fff;padding:calc(var(--font-size-base) * 0.2) calc(var(--font-size-base) * 0.6);border-radius:20px;font-weight:900}
#fixedArrow{font-size:calc(var(--font-size-base) * 0.8)!important;transition:.2s}
.fixed-body{padding:calc(var(--font-size-base) * 0.4);display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--font-size-base) * 0.35);}
.fixed-body.hidden{display:none!important;}
.fixed-row{display:grid;grid-template-columns:calc(var(--font-size-base) * 1.6) 1fr calc(var(--font-size-base) * 3.8);gap:calc(var(--font-size-base) * 0.25);align-items:center;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:calc(var(--font-size-base) * 0.5);padding:calc(var(--font-size-base) * 0.25);}
.fixed-row .name{padding:calc(var(--font-size-base) * 0.35) calc(var(--font-size-base) * 0.25);border:1px solid var(--card-border);border-radius:calc(var(--font-size-base) * 0.4);font-weight:800;font-size:calc(var(--font-size-base) * 0.52)!important;background:var(--card);color:var(--text);width:100%;text-align:right;}
.fixed-row .amt{padding:calc(var(--font-size-base) * 0.35) calc(var(--font-size-base) * 0.2);border:1px solid var(--hero);border-radius:calc(var(--font-size-base) * 0.4);font-weight:900;font-size:calc(var(--font-size-base) * 0.55)!important;background:var(--card);color:var(--text);width:100%;text-align:center;}
.fixed-del{width:calc(var(--font-size-base) * 1.6);height:calc(var(--font-size-base) * 1.6);border:none;background:#fee2e2;color:#ef4444;border-radius:calc(var(--font-size-base) * 0.35);cursor:pointer;font-weight:900;font-size:calc(var(--font-size-base) * 0.6)!important;display:flex;align-items:center;justify-content:center;}
.add-fixed{grid-column:1/-1;width:100%;margin-top:calc(var(--font-size-base) * 0.3);padding:calc(var(--font-size-base) * 0.6);background:var(--hero);color:#fff;border:none;border-radius:calc(var(--font-size-base) * 0.6);font-weight:900;font-size:calc(var(--font-size-base) * 0.6)!important;cursor:pointer;}

.fbar{background:var(--card);border:1.5px solid var(--card-border);border-radius:11px;padding:6px;margin-bottom:8px;display:flex;gap:5px;overflow:auto;align-items:center;flex-wrap:wrap}
.fbar input,.fbar select{padding:calc(var(--font-size-base) * 0.4);border:1px solid var(--card-border);border-radius:7px;font-size:calc(var(--font-size-base) * 0.52)!important;background:var(--bg-soft);color:var(--text);min-width:calc(var(--font-size-base) * 5)}

/* الإجمالي منسق أكثر - خطوط أوضح */
.tsec{background:var(--card);border:1.5px solid var(--card-border);border-radius:13px;overflow:hidden;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.thead{padding:calc(var(--font-size-base) * 0.7) calc(var(--font-size-base) * 0.8);display:flex;justify-content:space-between;align-items:center;background:var(--gradient);color:#fff;cursor:pointer;user-select:none}
.thead-left{display:flex;align-items:center;gap:calc(var(--font-size-base)*0.5)}
.thead-left b{font-size:calc(var(--font-size-base) * 0.68)!important;font-weight:900;letter-spacing:.3px}
.thead-left .secArrow{font-size:calc(var(--font-size-base)*0.7);background:rgba(255,255,255,.15);width:calc(var(--font-size-base)*1.6);height:calc(var(--font-size-base)*1.6);border-radius:50%;display:flex;align-items:center;justify-content:center}
.thead-right{display:flex;align-items:center;gap:calc(var(--font-size-base)*0.4)}
.thead .sum{font-size:calc(var(--font-size-base) * 0.62)!important;font-weight:900;background:rgba(255,255,255,.12);padding:calc(var(--font-size-base)*0.2) calc(var(--font-size-base)*0.6);border-radius:20px}
.thead .add{padding:calc(var(--font-size-base)*0.3) calc(var(--font-size-base)*0.7);border-radius:20px;border:none;background:#fff;color:var(--hero);font-weight:900;font-size:calc(var(--font-size-base) * 0.52)!important;cursor:pointer}
.thead .editBtn{width:calc(var(--font-size-base)*1.8);height:calc(var(--font-size-base)*1.8);border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:calc(var(--font-size-base)*0.6);cursor:pointer;display:flex;align-items:center;justify-content:center}
.twrap{overflow:auto;transition:.2s}
table{width:100%;border-collapse:collapse;min-width:420px}
th{padding:calc(var(--font-size-base) * 0.55) 4px;font-size:calc(var(--font-size-base) * 0.5)!important;color:#94a3b8;text-align:center;font-weight:900;background:var(--bg-soft);white-space:nowrap;border-bottom:1px solid var(--card-border)}
td{padding:calc(var(--font-size-base) * 0.6) 4px;text-align:center;font-weight:800;font-size:calc(var(--font-size-base) * 0.55)!important;color:var(--text);border-bottom:1px solid var(--bg-soft);white-space:nowrap}
td.band{font-weight:900;text-align:right;padding-right:8px;font-size:calc(var(--font-size-base)*0.58)!important}
td.zero{color:#cbd5e1}
.row-actions{display:flex;gap:3px;justify-content:center}
.row-actions button{width:calc(var(--font-size-base)*1.5);height:calc(var(--font-size-base)*1.5);border-radius:5px;border:1px solid var(--card-border);background:var(--bg-soft);font-size:calc(var(--font-size-base)*0.5);cursor:pointer}

.fab{position:fixed;bottom:calc(var(--font-size-base) * 6);left:50%;transform:translateX(-50%);width:calc(var(--font-size-base) * 3.5);height:calc(var(--font-size-base) * 3.5);border-radius:50%;background:#7dd3e0;color:var(--hero);border:none;font-size:calc(var(--font-size-base) * 1.5)!important;z-index:60;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:100;backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.card-m{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:calc(var(--font-size-base)*1.2) calc(var(--font-size-base)*0.9) calc(var(--font-size-base)*1.6);max-height:88vh;overflow:auto;box-shadow:0 -8px 32px rgba(0,0,0,.25)}
.q-tabs{display:flex;gap:6px;background:var(--bg-soft);padding:calc(var(--font-size-base)*0.4);border-radius:14px;margin-bottom:calc(var(--font-size-base)*0.7)}
.qbtn{flex:1;padding:calc(var(--font-size-base)*0.7) 4px;border:1.5px solid var(--card-border);border-radius:11px;background:var(--card);font-size:calc(var(--font-size-base) * 0.62)!important;font-weight:900;cursor:pointer;color:var(--text);text-align:center;min-height:calc(var(--font-size-base)*2.6)}
.qbtn.active{background:var(--hero);color:#fff;border-color:var(--hero)}
.input-dark{width:100%;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:12px;padding:calc(var(--font-size-base)*0.85) calc(var(--font-size-base)*0.7);font-weight:800;color:var(--text);font-size:calc(var(--font-size-base) * 0.68)!important;min-height:calc(var(--font-size-base)*2.9)}
.input-big{background:var(--card);border:2px solid var(--hero);border-radius:12px;padding:calc(var(--font-size-base)*1) calc(var(--font-size-base)*0.7);font-weight:900;font-size:calc(var(--font-size-base) * 1.1)!important;text-align:center;color:var(--text);width:100%;min-height:calc(var(--font-size-base)*3.3)}
.label-mini{font-size:calc(var(--font-size-base) * 0.48)!important;color:var(--text-soft);font-weight:800;margin-bottom:3px;display:block}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:10px;padding:8px 10px;margin-top:8px}
.switch{position:relative;width:42px;height:22px;background:#e2e8f0;border-radius:20px;cursor:pointer;transition:.2s}
.switch.on{background:#22c55e}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{transform:translateX(20px)}
.view{display:none}.view.active{display:block}
</style>
</head>
<body>
<div class="app">
<div class="top"><h3>📒 اليومية</h3><div id="today">2026/08/24</div></div>
<div class="main-tabs">
<button class="mtab" data-t="expense" onclick="switchTab('expense')">مصروف</button>
<button class="mtab" data-t="income" onclick="switchTab('income')">دخل</button>
<button class="mtab" data-t="debt" onclick="switchTab('debt')">ديون</button>
<button class="mtab" data-t="amanat" onclick="switchTab('amanat')">أمانات</button>
<button class="mtab active" data-t="total" onclick="switchTab('total')">الإجمالي</button>
</div>

<div id="p-total" class="view active">
<div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-total">أغسطس 2026</span><small id="ml-total-sub">2026-08</small></div><button onclick="shiftMonth(1)">›</button></div>
<div class="kpi-grid-5" id="kpi-total"></div>
<div class="fbar"><input id="f-total-q" placeholder="فلتر بند" oninput="renderTotalTables()" style="flex:1"><button class="add-fixed" style="width:auto;margin:0;padding:6px 12px" onclick="openAdd()">+ بند</button></div>
<div id="total-tables"></div>
</div>

<div id="p-expense" class="view">
<div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-expense">أغسطس 2026</span><small id="ml-expense-sub">2026-08</small></div><button onclick="shiftMonth(1)">›</button></div>
<div class="kpi-grid-5" id="kpi-expense"></div>
<div class="fixed-box" id="fixedBox">
<div class="fixed-head" onclick="toggleFixedBox()"><div style="display:flex;align-items:center;gap:6px"><b>📌 إجمالي المصروفات الثابتة</b><span id="fixedTotalBadge">0 ج</span></div><span id="fixedArrow">▼</span></div>
<div class="fixed-body" id="fixedBody"></div>
</div>
<div class="fbar"><select id="f-exp-wallet" onchange="renderExpense()"><option value="">محفظة</option><option>كاش</option><option>محفظة</option><option>فيزا</option></select><input id="f-exp-q" placeholder="بند" oninput="renderExpense()"><input id="f-exp-from" type="date" onchange="renderExpense()"><input id="f-exp-to" type="date" onchange="renderExpense()"><button onclick="setMonthFilter()" style="padding:5px 10px;border-radius:7px;border:1px solid var(--card-border);background:var(--bg-soft);font-weight:800;font-size:calc(var(--font-size-base)*0.52)">شهر</button></div>
<div id="t-expense"></div>
</div>

<div id="p-income" class="view"><div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-income">أغسطس 2026</span><small id="ml-income-sub">2026-08</small></div><button onclick="shiftMonth(1)">›</button></div><div class="kpi-grid-5" id="kpi-income"></div><div id="t-income"></div></div>
<div id="p-debt" class="view"><div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-debt">أغسطس 2026</span><small id="ml-debt-sub">2026-08</small></div><button onclick="shiftMonth(1)">›</button></div><div class="kpi-grid-5" id="kpi-debt"></div><div id="t-debt"></div></div>
<div id="p-amanat" class="view"><div class="month-nav"><button onclick="shiftMonth(-1)">‹</button><div class="month-label"><span id="ml-amanat">أغسطس 2026</span><small id="ml-amanat-sub">2026-08</small></div><button onclick="shiftMonth(1)">›</button></div><div class="kpi-grid-5" id="kpi-amanat"></div><div id="t-amanat"></div></div>
</div>
<button class="fab" onclick="openAdd()">+</button>

<div class="modal" id="addModal" onclick="if(event.target==this)closeAdd()">
<div class="card-m">
<div class="q-tabs">
<button class="qbtn active" id="ct-expense" onclick="setCard('expense')">مصروف</button>
<button class="qbtn" id="ct-income" onclick="setCard('income')">دخل</button>
<button class="qbtn" id="ct-debt" onclick="setCard('debt')">ديون</button>
<button class="qbtn" id="ct-amanat" onclick="setCard('amanat')">أمانات</button>
</div>
<div style="background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:12px;padding:4px;display:flex;align-items:center;gap:6px;margin-bottom:10px">
<label style="font-size:calc(var(--font-size-base) * 0.6);font-weight:800;padding:0 6px">قيمة</label>
<input id="a-amount" type="number" inputmode="numeric" pattern="[0-9]*" class="input-big" style="border:none;background:var(--card)" placeholder="0" autofocus>
</div>
<div id="fields-expense">
<div class="grid-2"><div><label class="label-mini">محفظة</label><select id="a-wallet" class="input-dark"><option>كاش</option><option>محفظة</option><option>فيزا</option><option>انستا باي</option></select></div><div><label class="label-mini">بند</label><select id="a-item-select" class="input-dark" onchange="onBandSelect(this.value)"></select><input id="a-item" placeholder="بند جديد" class="input-dark" style="margin-top:4px;display:none"></div></div>
<div class="grid-2"><div><label class="label-mini">تاريخ</label><input id="a-date" type="date" class="input-dark"></div><div><label class="label-mini">ملاحظة</label><input id="a-note" placeholder="ملاحظة" class="input-dark"></div></div>
</div>
<div id="fields-debt" style="display:none">
<div class="grid-2"><div><label class="label-mini">محفظة</label><select id="a-debt-wallet" class="input-dark"><option>كاش</option><option>محفظة</option></select></div><div><label class="label-mini">نوع</label><select id="a-debt-type" class="input-dark"><option>مستحق</option><option>مؤجل</option></select></div></div>
<div class="grid-2"><div><label class="label-mini">شخص</label><select id="a-debt-person" class="input-dark"><option>احمد</option><option>سامي</option><option>محمد</option></select></div><div><label class="label-mini">عليا/ليا</label><select id="a-debt-dir" class="input-dark"><option>عليا</option><option>ليا</option></select></div></div>
<div style="margin-top:6px"><label class="label-mini">ملاحظة</label><input id="a-debt-note" placeholder="ملاحظة" class="input-dark"></div>
</div>
<div id="fields-amanat" style="display:none">
<div class="grid-2"><div><label class="label-mini">محفظة</label><select id="a-amanat-wallet" class="input-dark"><option>الأمانات</option><option>كاش</option></select></div><div><label class="label-mini">شخص</label><select id="a-amanat-person" class="input-dark"><option>سامي</option><option>احمد</option></select></div></div>
<div class="grid-2"><div><label class="label-mini">تاريخ</label><input id="a-amanat-date" type="date" class="input-dark"></div><div><label class="label-mini">ملاحظة</label><input id="a-amanat-note" placeholder="ملاحظة" class="input-dark"></div></div>
</div>
<div class="toggle-row"><div style="display:flex;align-items:center;gap:8px"><div id="balanceSwitch" class="switch on" onclick="toggleBalance()"></div><span style="font-size:calc(var(--font-size-base) * 0.6);font-weight:800">يوفر على الرصيد</span></div><span style="font-size:calc(var(--font-size-base) * 0.5);color:var(--text-soft)">الرصيد</span></div>
<div style="display:flex;gap:8px;margin-top:12px"><button onclick="closeAdd()" style="flex:1;padding:12px;background:var(--bg-soft);border:1.5px solid var(--card-border);border-radius:11px;font-weight:800;font-size:calc(var(--font-size-base) * 0.62)">إلغاء</button><button onclick="saveTx()" style="flex:1.5;padding:12px;background:var(--hero);color:#fff;border:none;border-radius:11px;font-weight:900;font-size:calc(var(--font-size-base) * 0.7)">حفظ</button></div>
</div>
</div>

<script>
let transactions=JSON.parse(localStorage.getItem('omar_tx_v3')||'[]');
if(transactions.length===0){
 transactions=[
  {id:'1',type:'expense',item:'الإيجار',amount:15675,date:'2026-08-08',wallet:'كاش'},
  {id:'2',type:'expense',item:'الكهرباء',amount:10000,date:'2026-08-08',wallet:'كاش'},
  {id:'3',type:'income',item:'مرتب الصيدلية',amount:14675,date:'2026-08-01',wallet:'كاش'},
  {id:'4',type:'debt',item:'أحمد',amount:5000,date:'2026-08-24',person:'أحمد',debtType:'مستحق'},
  {id:'5',type:'debt',item:'مؤجل',amount:10000,date:'2026-08-20',person:'مؤجل',debtType:'مؤجل'},
  {id:'6',type:'amanat',item:'سامي',amount:2000,date:'2026-08-10',person:'سامي',wallet:'الأمانات'}
 ];

let curTab='total',cardType='expense',curYM='2026-08';

function getFixedForMonth(ym){
 if(!fixedByMonth[ym] || fixedByMonth[ym].length===0 || fixedByMonth[ym].every(x=>Number(x.amount)===0)){
  fixedByMonth[ym]=fixedTemplates.map(t=>({id:t.id,name:t.name,amount:t.def}));
  persist();
 }
 if(fixedByMonth[ym].length < fixedTemplates.length){
  fixedTemplates.forEach(t=>{ if(!fixedByMonth[ym].find(x=>x.id===t.id)) fixedByMonth[ym].push({id:t.id,name:t.name,amount:t.def}); });
  persist();
 }
 return fixedByMonth[ym];
}

function toggleSection(head){

 wrap.style.display=isHidden?'block':'none';

}

function closeAdd(){document.getElementById('addModal').classList.remove('open');}
function saveTx(){let amount=Number(document.getElementById('a-amount').value)||0;if(!amount){alert('اكتب القيمة');return;}let common={id:Date.now().toString(),type:cardType,amount,affectBalance};if(cardType==='debt'){common.date=new Date().toISOString().slice(0,10);common.wallet=document.getElementById('a-debt-wallet').value||'كاش';common.debtType=document.getElementById('a-debt-type').value||'مستحق';common.person=document.getElementById('a-debt-person').value||'';common.debtDir=document.getElementById('a-debt-dir').value||'عليا';common.item=`دين ${common.person}`;}else if(cardType==='amanat'){common.date=document.getElementById('a-amanat-date').value||new Date().toISOString().slice(0,10);common.wallet=document.getElementById('a-amanat-wallet').value||'الأمانات';common.person=document.getElementById('a-amanat-person').value||'سامي';common.item=`أمانة ${common.person}`;}else{common.date=document.getElementById('a-date').value||new Date().toISOString().slice(0,10);common.wallet=document.getElementById('a-wallet').value||'كاش';common.item=document.getElementById('a-item').value||document.getElementById('a-item-select').value||'مصروف';}transactions.push(common);persist();closeAdd();renderAll();}
function delTx(id){if(!confirm('مسح؟'))return;transactions=transactions.filter(t=>t.id!==id);persist();renderAll();}
function renderAll(){renderKPIAll();if(curTab==='expense') renderFixedSection();if(curTab==='total') renderTotalTables();renderExpense();renderIncome();renderDebt();renderAmanat();}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('today').textContent='2026/08/24';const{first,last}=getMonthRange(curYM);let fe=document.getElementById('f-exp-from'); if(fe){fe.value=first;}let te=document.getElementById('f-exp-to'); if(te){te.value=last;}updateMonthLabels();fillBandSelect();renderAll();switchTab('total');});
</script>
