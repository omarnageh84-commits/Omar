<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المهام</title>
<script src="themes.js?v=28"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-main,'Tajawal',sans-serif)}
body{background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;padding:8px;padding-bottom:80px}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px;margin-bottom:8px}
.btn{border:1px solid var(--card-border);background:var(--bg-soft);padding:8px;border-radius:8px;font-weight:800;font-size:9px;cursor:pointer;color:var(--text);width:100%}
.btn.primary{background:var(--hero);color:#fff}
.task{display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--bg-soft);border:1px solid var(--card-border);border-radius:8px;margin-bottom:5px}
.task.done{opacity:.6;text-decoration:line-through}
</style>
</head>
<body>
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:11px">✅ المهام</b><span id="tasksCount" style="font-size:7px;background:var(--hero);color:#fff;padding:2px 6px;border-radius:20px">0</span></div>
<div class="card"><div style="display:flex;gap:5px"><input id="taskInput" placeholder="مهمة جديدة..." style="flex:1;padding:8px;border:1px solid var(--card-border);border-radius:8px;background:var(--bg-soft);color:var(--text);font-size:10px"><button class="btn primary" style="width:70px" onclick="addTask()">إضافة</button></div></div>
<div class="card"><div id="tasksList"></div></div>
<script>
let tasks=JSON.parse(localStorage.getItem('tasks_data')||localStorage.getItem('omar_tasks')||'[]');
function persist(){localStorage.setItem('tasks_data',JSON.stringify(tasks)); localStorage.setItem('omar_tasks',JSON.stringify(tasks));}
function renderTasks(){
 document.getElementById('tasksCount').textContent=tasks.length;
 document.getElementById('tasksList').innerHTML=tasks.map((t,i)=>`<div class="task ${t.done?'done':''}"><span onclick="toggleTask(${i})" style="flex:1;cursor:pointer">${t.title||t.name}</span><button onclick="delTask(${i})" style="border:none;background:#fef2f2;color:#ef4444;border-radius:5px;padding:3px 7px">✕</button></div>`).join('')||'<small style="color:var(--text-soft)">لا يوجد مهام</small>';
}
function addTask(){let v=document.getElementById('taskInput').value.trim(); if(!v) return; tasks.push({title:v,done:false}); document.getElementById('taskInput').value=''; persist(); renderTasks();}
function toggleTask(i){tasks[i].done=!tasks[i].done; persist(); renderTasks();}
function delTask(i){tasks.splice(i,1); persist(); renderTasks();}
document.addEventListener('DOMContentLoaded',renderTasks);
</script>
</body>
</html>
